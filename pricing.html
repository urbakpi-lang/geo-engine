<style>.billing{display:inline-flex;border:1px solid var(--line-strong);border-radius:99px;overflow:hidden;margin:1rem 0}.billing button{border:none;background:var(--surface);padding:.45rem .9rem;cursor:pointer;font:600 .8rem "Libre Franklin",sans-serif;color:var(--ink-soft)}.billing button.on{background:var(--ink);color:var(--ground)}

<body>
<nav class="top" id="gpnav"></nav>
<main class="wrap" style="padding-top:2rem">
  <h1 data-t="h">Simple plans for every roastery</h1>

  <div class="billing"><button data-b="m" class="on" data-t="monthly">Monthly</button><button data-b="y" data-t="yearly">Yearly (2 months free)</button></div>
  <div class="grid g3" id="plans"></div>

  <div class="card" style="margin-top:1.4rem">
    <h3 data-t="extra_h">Extras</h3>
    <div class="scroll"><table class="t" id="extras"></table></div>
  </div>

  <div class="card">
    <h3 data-t="faq_h">Questions</h3>
    <dl class="faq" id="faq"></dl>
  </div>
  <div id="contact" class="card">
    <h3 data-t="contact_h">Talk to us</h3>
    <p class="muted" data-t="contact_p">For Business, origin profiles or sponsoring, leave your email and we reply within one working day.</p>
    <form id="lf" class="row" autocomplete="on">
      <input class="i" style="flex:1;min-width:200px" name="email" type="email" required placeholder="you@company.com">
      <input class="i" style="flex:1;min-width:160px" name="company" data-tp="company" placeholder="Company">
      <select class="i" name="kind" style="width:auto"><option value="business" data-t="o_business">Business plan</option><option value="origin" data-t="o_origin">Origin profile</option><option value="sponsor" data-t="o_sponsor">Sponsoring</option><option value="other" data-t="o_other">Other</option></select>
      <button class="btn" data-t="send">Send</button>

    <div id="lmsg"></div>
  </div>
</main>
<footer class="ft" id="gpfoot"></footer>

(function(){

  function li(a){ return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'; }
  function price(m,y){ return billing==="m" ? '€'+m+' <span class="faint">'+esc(t("per_m"))+'</span>' : '€'+y+' <span class="faint">'+esc(t("per_y"))+'</span>'; }
  function render(){
    GP.applyI18n();
    document.querySelectorAll(".billing button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-b")===billing); });
