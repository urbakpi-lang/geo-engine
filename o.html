<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verified origins — GroveProof · EUDR check for coffee</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Coffee origins checked against satellite deforestation data (EUDR cut-off 31 Dec 2020).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="assets/gp.css">
<script src="assets/gp.js"></script>
<style>.hero{padding:2.2rem 0 1rem}.seal{display:inline-flex;align-items:center;gap:.5rem;background:var(--good-soft);color:var(--good);border-radius:99px;padding:.35rem .8rem;font:600 .78rem "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em}</style>
</head>
<body>
<nav class="top" id="gpnav"></nav>
<main class="wrap">
  <div id="box"><p class="muted hero" data-t="loading">Loading…</p><p class="faint" id="waking"></p></div>
</main>
<footer class="ft" id="gpfoot"></footer>
<script>
GP.strings = {
  en:{loading:"Loading…",waking:"Waking up the server, this can take up to a minute…",notfound:"This page does not exist or is not published.",seal:"Origins checked by satellite",
    intro:"%n checked the farms its coffee comes from against satellite forest data. EUDR rule: no deforestation after 31 December 2020.",
    k_plots:"Plots of origin",k_ok:"Deforestation-free",k_countries:"Countries",k_last:"Last check",
    plot:"Plot",country:"Country",result:"Result",checked:"Checked",privacy:"Locations are rounded to about 1 km and producer names are not shown, to protect the farmers.",
    how_h:"How it works",how_p:"GroveProof compares each farm with public satellite datasets (Global Forest Watch: JRC forest cover 2020, UMD tree cover loss, protected areas). A screening result is not a legal certificate; the company remains responsible for its due diligence.",
    method:"Read the methodology",visit:"Visit the website",own:"Are you a roaster? Check your own origins for free",at_risk:"Under review"},
  de:{loading:"Wird geladen…",waking:"Server startet, das kann bis zu einer Minute dauern…",notfound:"Diese Seite existiert nicht oder ist nicht veröffentlicht.",seal:"Herkunft per Satellit geprüft",
    intro:"%n hat die Farmen, von denen sein Kaffee stammt, mit Satelliten-Walddaten geprüft. EUDR-Regel: keine Entwaldung nach dem 31. Dezember 2020.",
    k_plots:"Herkunftsflurstücke",k_ok:"Entwaldungsfrei",k_countries:"Länder",k_last:"Letzte Prüfung",
    plot:"Flurstück",country:"Land",result:"Ergebnis",checked:"Geprüft",privacy:"Standorte sind auf ca. 1 km gerundet, Produzentennamen werden zum Schutz der Bauern nicht gezeigt.",
    how_h:"So funktioniert es",how_p:"GroveProof vergleicht jede Farm mit öffentlichen Satellitendaten (Global Forest Watch: JRC-Waldbedeckung 2020, UMD-Baumverlust, Schutzgebiete). Ein Screening-Ergebnis ist kein rechtliches Zertifikat; das Unternehmen bleibt für seine Sorgfaltspflicht verantwortlich.",
    method:"Zur Methodik",visit:"Zur Website",own:"Sie rösten selbst? Prüfen Sie Ihre Herkünfte kostenlos",at_risk:"In Prüfung"},
  it:{loading:"Caricamento…",waking:"Il server si sta svegliando, può servire fino a un minuto…",notfound:"Questa pagina non esiste o non è pubblicata.",seal:"Origini verificate da satellite",
    intro:"%n ha verificato le aziende agricole da cui arriva il suo caffè con i dati satellitari sulle foreste. Regola EUDR: nessuna deforestazione dopo il 31 dicembre 2020.",
    k_plots:"Particelle d'origine",k_ok:"Senza deforestazione",k_countries:"Paesi",k_last:"Ultima verifica",
    plot:"Particella",country:"Paese",result:"Esito",checked:"Verificata",privacy:"Le posizioni sono arrotondate a circa 1 km e i nomi dei produttori non sono mostrati, per tutelare i coltivatori.",
    how_h:"Come funziona",how_p:"GroveProof confronta ogni azienda agricola con dati satellitari pubblici (Global Forest Watch: copertura forestale JRC 2020, perdita di copertura arborea UMD, aree protette). L'esito di uno screening non è un certificato legale; l'azienda resta responsabile della propria due diligence.",
    method:"Leggi la metodologia",visit:"Visita il sito",own:"Sei una torrefazione? Verifica gratis le tue origini",at_risk:"In verifica"}
};
(function(){
  var esc=GP.esc, t=GP.t, data=null, slug=new URLSearchParams(location.search).get("s")||"";
  GP.onWaking=function(){ var w=document.getElementById("waking"); if(w) w.textContent=t("waking"); };
  GP.onLang=function(){ GP.nav(); render(); };
  function vt(v){ return v==="A_RISCHIO" ? '<span class="chip miss">'+esc(t("at_risk"))+'</span>' : GP.vchip(v); }
  function render(){
    var box=document.getElementById("box"); GP.applyI18n();
    if(!data){ return; }
    var s=data.summary, name=data.name||slug, safeWeb=/^https?:\/\//i.test(data.website||"")?data.website:(data.website?"https://"+data.website:"");
    document.title = name+" — "+t("seal")+" · GroveProof, "+GP.tagline();
    box.innerHTML =
      '<section class="hero"><span class="seal">✓ '+esc(t("seal"))+'</span><h1 style="margin-top:.8rem">'+esc(name)+'</h1>'+
      '<p class="muted" style="max-width:680px">'+esc(t("intro").replace("%n",name))+'</p>'+
      (data.text?'<p style="max-width:680px">'+esc(data.text)+'</p>':'')+
      (safeWeb?'<a class="btn sm ghost" href="'+esc(safeWeb)+'" rel="noopener" target="_blank">'+esc(t("visit"))+' →</a>':'')+'</section>'+
      '<div class="grid g4"><div class="card kpi"><div class="n">'+s.plots+'</div><div class="k">'+esc(t("k_plots"))+'</div></div>'+
      '<div class="card kpi"><div class="n" style="color:var(--good)">'+s.deforestation_free+'</div><div class="k">'+esc(t("k_ok"))+'</div></div>'+
      '<div class="card kpi"><div class="n">'+s.countries.length+'</div><div class="k">'+esc(t("k_countries"))+'</div><div class="faint">'+esc(s.countries.join(", "))+'</div></div>'+
      '<div class="card kpi"><div class="n" style="font-size:1.3rem">'+esc((s.last_check||"—").slice(0,10))+'</div><div class="k">'+esc(t("k_last"))+'</div></div></div>'+
      '<div class="card" style="margin-top:1rem"><div class="map" id="omap"></div><p class="faint">'+esc(t("privacy"))+'</p>'+
      '<div class="scroll"><table class="t"><tr><th>'+esc(t("plot"))+'</th><th>'+esc(t("country"))+'</th><th>ha</th><th>'+esc(t("result"))+'</th><th>'+esc(t("checked"))+'</th></tr>'+
      data.plots.map(function(p){ return '<tr><td class="mono">'+esc(p.ref)+'</td><td>'+esc(p.country)+'</td><td>'+esc(p.area_ha==null?"":p.area_ha)+'</td><td>'+vt(p.verdict)+'</td><td class="mono faint">'+esc((p.checked_at||"").slice(0,10))+'</td></tr>'; }).join("")+
      '</table></div></div>'+
      '<div class="card"><h3>'+esc(t("how_h"))+'</h3><p class="muted">'+esc(t("how_p"))+'</p><div class="row"><a class="btn sm ghost" href="index.html#method">'+esc(t("method"))+'</a><a class="btn sm" href="index.html?ref=origin-page#tool">'+esc(t("own"))+'</a></div></div>';
    var m=GP.map("omap"); m.draw(data.plots.map(function(p){ return {lat:p.lat,lng:p.lng,verdict:p.verdict==="A_RISCHIO"?"DATI_MANCANTI":p.verdict,label:data.plots.length<=30?p.ref:""}; }));
  }
  GP.nav(); GP.applyI18n();
  if(!/^[a-z0-9-]{3,60}$/.test(slug)){ document.getElementById("box").innerHTML='<p class="hero muted">'+esc(t("notfound"))+'</p>'; return; }
  GP.api("/public/"+encodeURIComponent(slug)).then(function(d){ data=d; if(!new URLSearchParams(location.search).get("lang") && !GP.store("gp_lang") && d.lang){ GP.lang=d.lang; GP.nav(); } render(); })
    .catch(function(){ document.getElementById("box").innerHTML='<p class="hero muted">'+esc(t("notfound"))+'</p>'; });
})();
</script>
</body>
</html>
